# ==============================================================================
# PhishGuard AI — Docker Compose Orchestration
# ==============================================================================
# Note:
# 1. The model must be trained before starting the application:
#    - On host: python download_data.py && python train.py
#    - Or via one-off compose run: docker compose run --rm backend python train.py
# 2. Volumes mount models/, data/, and SQLite database from the host to ensure persistence
#    without baking large binaries or dynamic state into container image layers.
# 3. Backend is strictly bound to the internal compose network (no published host ports).
#    Frontend publishes port 5173 (or $FRONTEND_PORT) and proxies /api to backend:5000.
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
    volumes:
      # Mount host models directory (contains model binaries and metrics JSON)
      - ./models:/app/models:ro
      # Mount host data directory (contains dataset)
      - ./data:/app/data:ro
      # Persist SQLite scan history database on host
      - ./phishguard.db:/app/phishguard.db:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - phishguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phishguard-network

networks:
  phishguard-network:
    driver: bridge
