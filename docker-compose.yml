# ==============================================================================
# PhishGuard AI — Docker Compose Orchestration
# ==============================================================================
#
# IMPORTANT NOTE ON VOLUMES:
# - models/: Mount host ./models to /app/models so the backend can load the
#            trained classifier without requiring large binary model files in
#            the container image.
# - data/:   Mount host ./data to /app/data to supply the UCI dataset for
#            training runs inside the container without bloating images.
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - SECRET_KEY=docker-production-secret-phishguard-ai-key-32ch
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80
      - RATE_LIMIT_PREDICT=60 per minute
      - MAX_BATCH_SIZE=100
    volumes:
      # Mount host models directory (contains model binaries and metrics JSON)
      - ./models:/app/models:ro
      # Mount host data directory (contains UCI dataset if running training)
      - ./data:/app/data:ro
      # Persist SQLite scan history database on host
      - ./phishguard.db:/app/phishguard.db:rw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
