[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "1.1.0"
description = "PhishGuard AI: Production-grade phishing URL detection from static lexical metrics"
authors = [{ name = "PhishGuard AI Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0,<5.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "ucimlrepo>=0.0.7,<1.0.0",
    "tldextract>=5.1.0,<6.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "flask>=3.0.0,<4.0.0",
    "flask-cors>=4.0.0,<5.0.0",
    "flask-limiter>=3.5.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-cov>=4.1.0,<7.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.9.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "frontend/node_modules",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E402", # module level import not at top of file (needed for path injections in scripts)
    "F401", # imported but unused (handled per-case if intentional)
]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = [
    "backend/tests",
    "frontend",
    "node_modules",
    ".venv",
]
